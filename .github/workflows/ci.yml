name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Format check (prettier)
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build CLI
        run: bun run build

      - name: CLI smoke test (plain Node, empty config dir)
        run: node dist/cli/index.js --help

      - name: Unit tests
        run: bun test src/core/core.test.ts

      - name: Fuzz tests (canonicalizer + unicode)
        run: bun run test:fuzz

      - name: Golden attack corpus
        run: bun run test:golden

      - name: Chaos lab (no-crash gate)
        run: bun run chaos
