name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: verify (ubuntu, bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Format check (prettier)
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build CLI and plugin bundles
        run: bun run build

      - name: Unit tests (vitest + bun)
        run: bun run test

      - name: Fuzz tests (canonicalizer + unicode)
        run: bun run test:fuzz

      - name: Golden attack corpus
        run: bun run test:golden

      - name: Chaos lab (no-crash gate)
        run: bun run chaos

      - name: End-to-end smoke test (init, doctor, update, uninstall)
        run: bun run smoke

  cross-os:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Build CLI and plugin bundles
        run: npm run build

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: End-to-end smoke test on plain Node
        run: npm run smoke
