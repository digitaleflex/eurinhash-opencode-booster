name: Bug Report
description: Report a bug or defect
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report — Tollfree Canonical Issue Contract
        Fill in all required sections. Missing data is represented as `UNKNOWN`, never guessed.

  - type: input
    id: title
    attributes:
      label: Title
      description: Concise, specific title (5-120 chars)
      placeholder: "Unicode homoglyph bypass in classifier"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      options:
        - bug
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - open
        - in_progress
        - blocked
        - review
        - closed
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What is the bug? (min 20 chars)
      placeholder: "Classifier fails to detect Cyrillic homoglyphs in destructive commands..."
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired Outcome
      description: What should happen instead? (min 20 chars)
      placeholder: "All homoglyph variants of destructive keywords are detected and blocked..."
    validations:
      required: true

  - type: textarea
    id: user_system_impact
    attributes:
      label: User/System Impact
      description: Who is affected and how? (min 10 chars)
      placeholder: "Governance bypass possible — destructive operations classified as safe..."
    validations:
      required: true

  - type: textarea
    id: engineering_specs
    attributes:
      label: Engineering Spec References (URIs)
      placeholder: "https://github.com/digitaleflex/eurinhash-engineering/blob/main/specs/security.md"
    validations:
      required: true

  - type: textarea
    id: architecture_refs
    attributes:
      label: Architecture References (URIs)
      placeholder: "https://github.com/digitaleflex/opencode-config/blob/main/docs/architecture.md"
    validations:
      required: true

  - type: checkboxes
    id: read_repositories
    attributes:
      label: Repositories to READ
      options:
        - label: engineering (digitaleflex/eurinhash-engineering)
        - label: config (digitaleflex/opencode-config)
        - label: product (digitaleflex/eurinhash-opencode)
    validations:
      required: true

  - type: checkboxes
    id: write_repositories
    attributes:
      label: Repositories Authorized to WRITE
      options:
        - label: engineering (digitaleflex/eurinhash-engineering)
        - label: config (digitaleflex/opencode-config)
        - label: product (digitaleflex/eurinhash-opencode)
    validations:
      required: true

  - type: textarea
    id: must_change
    attributes:
      label: MUST CHANGE
      placeholder: "config | src/core/classifier.ts | UPDATE | Fix Unicode normalization\nconfig | src/core/guard-overrides.ts | UPDATE | Fix guard pattern matching"
    validations:
      required: true

  - type: textarea
    id: may_change
    attributes:
      label: MAY CHANGE
      placeholder: "config | tests/fuzz/unicode.fuzz.test.ts | UPDATE | Add regression tests"

  - type: textarea
    id: must_not_change
    attributes:
      label: MUST NOT CHANGE
      placeholder: "config | src/core/types.ts | Core types stable"

  - type: textarea
    id: implementation_steps
    attributes:
      label: Implementation Steps
      placeholder: "1 | config | Fix normalizeForMatching in unicode-normalize.ts | builder | | Tests pass\n2 | config | Verify classifier uses normalized variants | builder | 1 | Fuzz tests pass\n3 | config | Verify guard-overrides uses canonicalization | builder | 1 | Guard tests pass\n4 | config | Add audit logging for classification decisions | builder | 1 | Log output verified"

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      placeholder: "Cyrillic homoglyphs blocked | true | test_output\nZero-width chars stripped | true | test_output\nFullwidth variants normalized | true | test_output\nAll existing tests still pass | true | test_output"

  - type: textarea
    id: failure_stop_conditions
    attributes:
      label: Failure/Stop Conditions
      placeholder: "Unicode normalization breaks existing classification | STOP | Revert and investigate"

  - type: checkboxes
    id: audit_trail
    attributes:
      label: Audit Trail Required
      options:
        - label: Yes, record decision metadata without secrets
    validations:
      required: true